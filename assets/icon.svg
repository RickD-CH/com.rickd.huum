<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960">
  <!-- App icon: a sauna heater (kiuas) — a solid tapered body with a mound
       of stones on top and three rising steam curls. One colour, no
       background, full 960 canvas (Homey icon guideline 1.5). -->
  <g fill="#111" stroke="#111" stroke-linecap="round" stroke-linejoin="round">
    <!-- steam -->
    <path d="M356 300c56-40 56-104 0-144" fill="none" stroke-width="46"/>
    <path d="M480 288c64-44 64-116 0-160" fill="none" stroke-width="46"/>
    <path d="M604 300c56-40 56-104 0-144" fill="none" stroke-width="46"/>

    <!-- heater body -->
    <path d="M296 470h368l-48 330a70 70 0 0 1-69 60H413a70 70 0 0 1-69-60z"/>

    <!-- mound of stones -->
    <circle cx="360" cy="452" r="72"/>
    <circle cx="480" cy="430" r="86"/>
    <circle cx="600" cy="452" r="72"/>
    <circle cx="420" cy="392" r="60"/>
    <circle cx="540" cy="392" r="60"/>
    <circle cx="480" cy="356" r="50"/>
  </g>
</svg>
