<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960">
  <!-- App icon: the HUUM UKU wall control panel, front view — square
       bezel, rotary dial with tick marks and a setting pointer, small
       digital display below. Outline/line-work only, transparent
       background, full 960x960 canvas, per Homey App Store icon
       guidelines. -->
  <g fill="none" stroke="#000000" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <!-- panel body -->
    <rect x="200" y="190" width="560" height="580" rx="60"/>

    <!-- dial -->
    <circle cx="480" cy="430" r="180"/>
    <circle cx="480" cy="430" r="128"/>

    <!-- tick marks around the dial -->
    <line x1="480" y1="250" x2="480" y2="220"/>
    <line x1="480" y1="610" x2="480" y2="640"/>
    <line x1="300" y1="430" x2="270" y2="430"/>
    <line x1="660" y1="430" x2="690" y2="430"/>
    <line x1="607" y1="303" x2="628" y2="282"/>
    <line x1="607" y1="557" x2="628" y2="578"/>
    <line x1="353" y1="303" x2="332" y2="282"/>
    <line x1="353" y1="557" x2="332" y2="578"/>

    <!-- setting pointer -->
    <line x1="480" y1="430" x2="557" y2="352"/>
    <circle cx="480" cy="430" r="14" fill="#000000" stroke="none"/>

    <!-- digital display -->
    <rect x="405" y="660" width="150" height="64" rx="14"/>
  </g>
</svg>
