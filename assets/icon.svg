<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960">
  <!-- App icon: sauna heater + rising steam (heat + humidity — the app's
       whole point). Outline/line-work only, transparent background, per
       Homey App Store icon guidelines (no fills, no background). -->
  <g fill="none" stroke="#000000" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <!-- cabinet -->
    <rect x="270" y="520" width="420" height="330" rx="36"/>
    <!-- control panel on the cabinet -->
    <rect x="330" y="600" width="120" height="90" rx="14"/>
    <circle cx="390" cy="645" r="10" fill="#000000" stroke="none"/>
    <!-- sauna stones on top -->
    <circle cx="390" cy="480" r="30"/>
    <circle cx="470" cy="465" r="34"/>
    <circle cx="555" cy="482" r="28"/>
    <!-- rising heat/steam lines -->
    <path d="M400 430 C360 380 440 350 400 300 C360 250 440 220 410 170"/>
    <path d="M480 420 C520 370 450 340 490 290 C530 240 460 210 490 150"/>
    <path d="M560 432 C600 388 540 355 575 305 C610 255 550 225 575 180"/>
  </g>
</svg>
