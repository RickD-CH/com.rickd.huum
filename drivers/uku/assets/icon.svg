<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960">
  <!-- Driver icon: the UKU heater unit itself, from a side/three-quarter
       angle (per guideline: prefer an angled view over front-facing).
       Deliberately a different composition from the app icon (outline
       only, transparent background) — must not reuse the app icon. -->
  <g fill="none" stroke="#000000" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <!-- wall mount -->
    <line x1="120" y1="260" x2="120" y2="760"/>
    <line x1="120" y1="330" x2="200" y2="310"/>
    <line x1="120" y1="690" x2="200" y2="710"/>

    <!-- cabinet, angled (back edge shorter/offset for a side-view feel) -->
    <path d="M200 300 L740 230 L740 760 L200 830 Z"/>

    <!-- heating grille on the front face -->
    <line x1="260" y1="420" x2="660" y2="380"/>
    <line x1="260" y1="500" x2="660" y2="465"/>
    <line x1="260" y1="580" x2="660" y2="550"/>
    <line x1="260" y1="660" x2="660" y2="635"/>

    <!-- sauna stones, foreshortened along the top opening -->
    <ellipse cx="330" cy="300" rx="28" ry="16"/>
    <ellipse cx="420" cy="285" rx="30" ry="16"/>
    <ellipse cx="515" cy="272" rx="28" ry="15"/>
    <ellipse cx="605" cy="260" rx="26" ry="14"/>
  </g>
</svg>
