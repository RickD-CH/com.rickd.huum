<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960">
  <!-- Driver icon: the same UKU wall control panel as the app icon, but
       from an angled/side view (per guideline: prefer an angle over a
       front-facing view for driver icons) — panel as a perspective
       trapezoid, dial as a foreshortened ellipse, angled display slot,
       small wall-mount marks. Deliberately a different composition from
       the app icon; outline only, transparent background, full 960x960
       canvas. -->
  <g fill="none" stroke="#000000" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- wall mount -->
    <line x1="170" y1="300" x2="115" y2="288"/>
    <line x1="170" y1="650" x2="115" y2="662"/>

    <!-- panel body, angled -->
    <path d="M170 190 L730 130 L730 680 L170 790 Z"/>

    <!-- dial, foreshortened -->
    <ellipse cx="460" cy="440" rx="140" ry="185"/>
    <ellipse cx="460" cy="440" rx="98" ry="130"/>

    <!-- setting pointer -->
    <line x1="460" y1="440" x2="548" y2="345"/>
    <circle cx="460" cy="440" r="13" fill="#000000" stroke="none"/>

    <!-- digital display, angled -->
    <path d="M398 648 L562 632 L562 698 L398 714 Z"/>
  </g>
</svg>
